<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Buttons Homework</title>
</head>
<body>

    <header>
        <div class="logo">Emily Jennett's Gallery</div>
        <nav>
            <a href="#" data-image="sailboat.jpg">Sailboat</a>

            <a href="#" data-image="blueberry.jpg">Blueberries</a>
            <a href="#" data-image="skincare.jpg">Skincsare</a>
        </nav>
    </header>

   <section class="gallery">
    <div class="thumbnails">
        <img class="thumb active" src="sailboat.jpg" alt="Sailboat">
        <img class="thumb" src="horse.jpg" alt="Horse">
        <img class="thumb" src="blueberry.jpg" alt="Blueberry">
        <img class="thumb" src="skincare.jpg" alt="Skincare">
    </div>

    <div class="display">
        <img id="mainImage" src="sailboat.jpg" alt="Sailboat">
    </div>
</section>

<script src="script.js"></script>

</body>
</html>
